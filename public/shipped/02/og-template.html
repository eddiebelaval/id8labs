<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shipped. — Issue 02 — OG card source (v2 thumb-optimized)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fafaf7;
    font-family: 'Archivo', sans-serif;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }

  /* paper grain */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    opacity: .32; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.22'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .page {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 48px 64px 40px;
    overflow: hidden;
  }

  /* The huge "02" — architecture behind the masthead */
  .huge-num {
    position: absolute;
    right: -26px;
    bottom: -130px;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-variation-settings: "opsz" 144;
    font-size: 780px;
    line-height: 0.78;
    letter-spacing: -0.045em;
    color: #efece3;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    -webkit-text-stroke: 1px rgba(0,0,0,0.06);
  }

  /* ── DATE BLOCK (TOP-LEFT, LARGE, ORANGE) ── */
  .date-block {
    position: absolute;
    top: 52px;
    left: 64px;
    z-index: 4;
  }
  .date-main {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-variation-settings: "opsz" 96;
    font-size: 88px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: #ff6b35;
  }
  .date-main em {
    font-style: italic;
    font-weight: 600;
    color: #ff6b35;
  }
  .date-sub {
    margin-top: 22px;
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #1a1a1a;
  }

  /* ── RIGHT META CLUSTER (issue + by-line) ── */
  .top-right {
    position: absolute;
    top: 44px;
    right: 64px;
    text-align: right;
    z-index: 4;
  }
  .issue-label {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: #6b6b6b;
    line-height: 1;
  }
  .issue-big {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #1a1a1a;
    margin-top: 4px;
  }
  .byline {
    margin-top: 8px;
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #1a1a1a;
  }

  /* ── CENTER: Masthead + punchy deck ── */
  .center {
    position: relative;
    z-index: 4;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-top: 44px;
  }
  .masthead {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-variation-settings: "opsz" 144;
    font-size: 212px;
    line-height: 0.86;
    letter-spacing: -0.045em;
    color: #1a1a1a;
    text-align: center;
  }
  .masthead .dot { color: #ff6b35; }

  /* Punchy deck: short, italic, bigger for thumb legibility */
  .deck {
    margin-top: 28px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-variation-settings: "opsz" 72;
    font-size: 54px;
    line-height: 1.04;
    letter-spacing: -0.02em;
    color: #1a1a1a;
    text-align: center;
    max-width: 900px;
  }
  .deck em {
    font-style: normal;
    color: #ff6b35;
    font-weight: 700;
  }

  /* ── BOTTOM FOLIO STRIP (minimal, readable) ── */
  .folio-bottom {
    position: absolute;
    bottom: 32px; left: 64px; right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #1a1a1a;
    z-index: 4;
    border-top: 1px solid #1a1a1a;
    padding-top: 14px;
  }
  .folio-bottom .vol { color: #6b6b6b; }
  .folio-bottom .url .dot { color: #ff6b35; }
  .folio-bottom .topic { color: #6b6b6b; }
  .folio-bottom .topic b { color: #1a1a1a; font-weight: 800; }
</style>
</head>
<body>
  <div class="page">
    <div class="huge-num">02</div>

    <!-- LEFT: Orange cadence block — issue-agnostic, thumb-legible -->
    <div class="date-block">
      <div class="date-main">Fridays<br>at <em>9</em>am.</div>
      <div class="date-sub">ET.</div>
    </div>

    <!-- RIGHT: Issue number cluster -->
    <div class="top-right">
      <div class="issue-label">Issue</div>
      <div class="issue-big">02</div>
      <div class="byline">by id8Labs</div>
    </div>

    <!-- CENTER: Masthead + punchy one-word deck -->
    <div class="center">
      <div class="masthead">Shipped<span class="dot">.</span></div>
      <div class="deck">The <em>product</em> turn.</div>
    </div>

    <!-- BOTTOM: minimal folio -->
    <div class="folio-bottom">
      <span class="vol">Vol. I</span>
      <span class="url">id8labs.app/shipped<span class="dot">.</span></span>
      <span class="topic"><b>Presence</b></span>
    </div>
  </div>
</body>
</html>
